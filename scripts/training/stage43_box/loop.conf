# Retry-loop settings, RE-READ ON EVERY ATTEMPT — edit while the loop runs; no restart needed.
# key=value, one per line; #-comments and blank lines ignored. Instance types live in gpu_types.txt.

# Seconds between attempts. Capacity windows during a shortage can be shorter than the old
# 15 min; 9 types x 2 API calls every 5 min is far below EC2's request limits.
POLL_SECONDS=300

# Give up after this many hours without a launch (the loop then exits 7).
MAX_HOURS=24
