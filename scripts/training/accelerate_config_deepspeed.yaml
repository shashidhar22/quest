# Accelerate configuration with DeepSpeed ZeRO-2 for p4d.24xlarge
# Use this for larger models (ESM2 3B) that need optimizer state sharding
#
# Usage:
#   accelerate launch --config_file accelerate_config_deepspeed.yaml esm_fine_tune.py \
#       --dataset_path /path/to/data --output_dir ./output
#
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_config_file: deepspeed_config_p4d.json
  zero3_init_flag: false
distributed_type: DEEPSPEED
downcast_bf16: 'no'
enable_cpu_affinity: true
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
