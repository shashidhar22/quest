name: track_b_teim
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.8
  - numpy=1.22.*
  - pandas=1.4.*
  - scipy=1.8.*
  - scikit-learn=1.1.*
  - biopython=1.79
  - tqdm
  - easydict
  - "pip<24.1"  # pl 1.6.4 has invalid metadata that pip>=24.1 rejects
  - pip:
      - setuptools<59  # torch 1.10 + setuptools>=59 hits distutils.version stub
      - torch==1.10.1
      - pytorch-lightning==1.6.4
      - pyarrow
