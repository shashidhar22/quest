name: track_b_ergo_ii
channels:
  - conda-forge
dependencies:
  # ERGO-II's requirements.txt: numpy 1.18, pandas 1.0, pytorch 1.4, pytorch-lightning 0.7.1,
  # scikit-learn 0.22 — all Python-3.7-era pins. The L4 GPU (sm_89) needs torch >= 2.0 / CUDA
  # 11.8+, so we cannot run torch 1.4 on GPU. For Phase-1 smoke test we run on CPU (100 rows
  # only). Phase 2 will need to either (a) run on CPU or (b) modernize the ERGO-II code to
  # newer pytorch-lightning. The verification doc flags this.
  - python=3.7
  - numpy=1.18.*
  - pandas=1.0.*
  - scikit-learn=0.22.*
  - pip
  - pip:
      - torch==1.7.1
      - pytorch-lightning==0.7.6
      - tensorboard
      - tidytcells
      - pyarrow
