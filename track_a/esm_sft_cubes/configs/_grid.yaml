# Phase 1 grid: 5 CPT checkpoints × 2 cubes = 10 runs.
# Each entry expands to a per-run YAML at materialize time (see run_phase1.py).

output_root: /home/ubuntu/quest/checkpoints/sft_retrieval/phase1_crossenc

defaults:
  epochs: 3
  lr: 1.0e-4
  weight_decay: 1.0e-5
  patience: 2
  neg_seed: 43
  seed: 42
  max_test_rows: 300
  eval_batch_size: 128
  n100_pool_size: 100
  n100_seeds: 10
  n100_base_seed: 42

runs:
